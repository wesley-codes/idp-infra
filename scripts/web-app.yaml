# An ArgoCD "Application" = the declarative version of the app you created in the UI.
# It tells ArgoCD: deploy whatever is at gitops/web in this repo, into the cluster,
# and keep it in sync automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wesley-codes/idp-infra.git
    targetRevision: main        
    path: gitops/web            
  destination:
    server: https://kubernetes.default.svc   
    namespace: default
  syncPolicy:
    automated:
      prune: true              
      selfHeal: true            
    syncOptions:
      - CreateNamespace=true
