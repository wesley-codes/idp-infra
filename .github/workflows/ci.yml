name: CI
on: 
 push: 
    branches: [main]
    paths:
    - "app/**"
    - ".github/workflows/**"

permissions:
    id-token: write
    contents: write 

env: 
  AWS_REGION: us-east-1
  ECR_REPOSITORY: idp-dev/web
  ROLE_ARN: arn:aws:iam::600406561872:role/idp-github-actions

jobs:
  build-and-push: 
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Semgrep SAST scan
        run: |
            pip install semgrep
            semgrep scan --config "p/default" app/

      - name: Login in to AWS via OIDC 
        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: ${{env.ROLE_ARN}}
            aws-region: ${{env.AWS_REGION}}

      - name: Login in Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Compute image name
        run: echo "IMAGE=${{steps.ecr.outputs.registry}}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_ENV"
    
      - name: Build the image 
        run: docker build -t "$IMAGE" ./app

      - name: Trivy image scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$IMAGE"

      - name: Push the image
        run: docker push "$IMAGE"

      - name: Update image tag & commit (GitOps handoff)
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" gitops/web/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/web/kustomization.yaml
          git commit -m "Deploy ${{ github.sha }}"
          git push
